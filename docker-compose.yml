name: preflight # You can also change this to another name to avoid warning with existing group.
services:
  backend:
    container_name: pf-backend
    build: .
    restart: unless-stopped
    ports:
      - ${PORT}:3000
    networks:
      - preflight_pf-net
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@pf-db:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - ./logs:/app/logs
networks:
  preflight_pf-net: # Check by using `docker network ls` command
    external: true
